{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
{{- $name := include "slack-jira-bot.name" . }}
{{- if not $es.secretStoreRef }}
# ESO が Secret Manager を読むときの ServiceAccount。アプリの Pod とは分けて、
# Secret Manager の権限をアプリに持たせないようにしている
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-secrets
  labels:
    {{- include "slack-jira-bot.labels" . | nindent 4 }}
  {{- with $es.gcpsm.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $name }}
  labels:
    {{- include "slack-jira-bot.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "externalSecret.gcpsm.projectID を指定してください" $es.gcpsm.projectID }}
      auth:
        workloadIdentity:
          {{- with $es.gcpsm.clusterLocation }}
          clusterLocation: {{ . }}
          {{- end }}
          {{- with $es.gcpsm.clusterName }}
          clusterName: {{ . }}
          {{- end }}
          {{- with $es.gcpsm.clusterProjectID }}
          clusterProjectID: {{ . }}
          {{- end }}
          serviceAccountRef:
            name: {{ $name }}-secrets
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "slack-jira-bot.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    {{- if $es.secretStoreRef }}
    {{- toYaml $es.secretStoreRef | nindent 4 }}
    {{- else }}
    kind: SecretStore
    name: {{ $name }}
    {{- end }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    {{- if not $es.data }}
    {{- fail "externalSecret.data を指定してください" }}
    {{- end }}
    {{- range $key, $remote := $es.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $remote }}
    {{- end }}
{{- end }}
