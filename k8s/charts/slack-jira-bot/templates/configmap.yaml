apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slack-jira-bot.name" . }}-config
  labels:
    {{- include "slack-jira-bot.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- /* 値が空（null）のキーは空文字にする。toString だと "<nil>" になるため */}}
  {{ $key }}: {{ ternary "" (toString $value) (kindIs "invalid" $value) | quote }}
  {{- end }}
