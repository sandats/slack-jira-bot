# Ingress は全拒否（Socket Mode は外向き接続のみ）。Egress は DNS と 443 のみ許可。
# FQDN での制限は NetworkPolicy では不可。必要なら Cloud NAT / FQDN ポリシーで
# slack.com, *.slack.com, api.atlassian.com に絞ってください。
# ※ kubelet のプローブはノードから来るため Ingress 全拒否でも通ります。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "slack-jira-bot.name" . }}
  labels:
    {{- include "slack-jira-bot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "slack-jira-bot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
