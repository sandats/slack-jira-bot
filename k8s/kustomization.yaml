apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: slack-jira-bot
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: slack-jira-bot-config
    envs:
      - config.env
images:
  - name: slack-jira-bot
    newName: REGION-docker.pkg.dev/PROJECT/REPO/slack-jira-bot
    newTag: latest
