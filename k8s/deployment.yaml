apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-jira-bot
  labels:
    app: slack-jira-bot
spec:
  replicas: 2   # Socket Mode は各 Pod が接続し、イベントはどれか 1 つに配送される
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: slack-jira-bot
  template:
    metadata:
      labels:
        app: slack-jira-bot
    spec:
      serviceAccountName: slack-jira-bot
      # 2 つの Pod をできるだけ別ノードに置く（ノード 1 台のクラスターでも起動できるよう ScheduleAnyway）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: slack-jira-bot
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: slack-jira-bot   # kustomization.yaml の images でリポジトリとタグを上書き
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: slack-jira-bot-config
            - secretRef:
                name: slack-jira-bot
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
