# コピーして secret.yaml を作り、値を入れて適用してください（Git にはコミットしない）。
# kubectl apply -n slack-jira-bot -f k8s/secret.yaml
# 運用では External Secrets / Secret Manager CSI などの利用を推奨します。
apiVersion: v1
kind: Secret
metadata:
  name: slack-jira-bot
  namespace: slack-jira-bot
type: Opaque
stringData:
  SLACK_BOT_TOKEN: xoxb-REPLACE
  SLACK_APP_TOKEN: xapp-REPLACE
  JIRA_API_TOKEN: REPLACE
